<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Rollercoaster</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f5; font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #hud {
    position: fixed; left: calc(16px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); padding: 10px 14px; border-radius: 10px;
    background: rgba(20, 18, 14, .5); color: #fff; font-size: 13px; line-height: 1.5;
    backdrop-filter: blur(6px); pointer-events: none; user-select: none; font-variant-numeric: tabular-nums;
  }
  #hud b { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
  #hud small { opacity: .75; }
  #mapTag { position: fixed; right: calc(16px + env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); padding: 6px 12px; border-radius: 999px; background: rgba(20,18,14,.45); color: #fff; font-size: 12px; letter-spacing: 1px; pointer-events: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(20, 24, 30, .6); color: #fff; text-align: center; user-select: none; padding: 20px; box-sizing: border-box;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  /* 터치 조작 버튼 */
  #touch {
    position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; z-index: 5; user-select: none; -webkit-user-select: none;
  }
  #touch.hidden { display: none; }
  #touch button {
    appearance: none; -webkit-appearance: none; border: 0; margin: 0; cursor: pointer; touch-action: manipulation;
    min-width: 54px; height: 54px; padding: 0 12px; border-radius: 14px; background: rgba(20,18,14,.55); color: #fff;
    font: 700 13px/1.15 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 2px 10px rgba(0,0,0,.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  #touch button span { font-size: 18px; line-height: 1; }
  #touch button:active { background: rgba(200,16,46,.75); transform: scale(.96); }
  #touch button.primary { background: rgba(200,16,46,.85); min-width: 64px; }
  /* 작은 화면 / 가로 모드 */
  @media (max-width: 640px) {
    #hud { bottom: calc(76px + env(safe-area-inset-bottom)); }
    #touch { left: calc(10px + env(safe-area-inset-left)); right: calc(10px + env(safe-area-inset-right)); justify-content: space-between; gap: 6px; }
    #touch button { min-width: 0; flex: 1 1 0; height: 52px; padding: 0 4px; border-radius: 12px; font-size: 12px; }
    #touch button.primary { flex: 1.25 1 0; }
    #touch button span { font-size: 17px; }
    #overlay { padding: 14px; padding-bottom: 80px; }
    #overlay .keys { display: none; }
    .maps { gap: 10px; margin-top: 14px; }
    .map { width: min(300px, 88vw); padding: 10px 12px; }
    .map .desc { display: none; }
    #overlay .btn { margin-top: 14px; padding: 12px 36px; font-size: 18px; }
    #hud b { font-size: 22px; }
    #hud { padding: 8px 10px; font-size: 12px; }
  }
  @media (max-height: 520px) {
    #overlay { justify-content: flex-start; padding-top: 10px; }
    #overlay h1 { font-size: 26px; margin: 0; }
    #overlay p, #overlay .keys { display: none; }
    .maps { margin-top: 8px; flex-wrap: nowrap; }
    .map { width: min(300px, 44vw); padding: 8px 12px; }
    .map .desc { display: none; }
    .map .stats { margin-top: 4px; }
    #overlay .btn { margin-top: 10px; padding: 10px 32px; font-size: 17px; }
  }
  #overlay h1 { font-size: clamp(32px, 6.5vw, 64px); margin: 0 0 4px; letter-spacing: -1px; text-shadow: 0 4px 24px rgba(0,0,0,.5); }
  #overlay .sub { font-size: clamp(12px, 2vw, 15px); letter-spacing: 3px; opacity: .8; text-transform: uppercase; }
  #overlay p { margin: 10px 0 0; font-size: clamp(14px, 2.2vw, 17px); opacity: .9; }
  .maps { display: flex; gap: 14px; margin-top: 22px; flex-wrap: wrap; justify-content: center; }
  .map {
    width: min(280px, 42vw); padding: 14px 16px; border-radius: 14px; text-align: left; cursor: pointer;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.15); transition: .15s;
  }
  .map:hover { background: rgba(255,255,255,.16); }
  .map.active { border-color: #ffcf3d; background: rgba(255,207,61,.14); }
  .map .name { font-size: 18px; font-weight: 700; }
  .map .tag { font-size: 11px; letter-spacing: 2px; opacity: .7; text-transform: uppercase; }
  .map .desc { font-size: 12px; opacity: .8; margin-top: 6px; line-height: 1.5; }
  .map .stats { font-size: 12px; margin-top: 8px; opacity: .9; font-variant-numeric: tabular-nums; }
  #overlay .btn {
    margin-top: 22px; padding: 14px 44px; border-radius: 999px; background: #c8102e; color: #fff; cursor: pointer;
    font-size: 20px; font-weight: 700; box-shadow: 0 8px 24px rgba(200,16,46,.45);
  }
  #overlay .keys { margin-top: 22px; font-size: 12px; opacity: .7; line-height: 1.9; }
  #overlay.hidden { display: none; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: #2a2620; font-size: 18px; }
  #loading.hidden { display: none; }
  kbd { background: rgba(255,255,255,.15); border-radius: 4px; padding: 1px 6px; font-family: inherit; }
</style>
</head>
<body>
<div id="loading">트랙을 건설하는 중... 🎢</div>
<div id="overlay" class="hidden">
  <div class="sub" id="ovSub">Rollercoaster</div>
  <h1>My Rollercoaster</h1>
  <p>저의 롤러코스터를 플레이 하세요!</p>
  <div class="maps" id="maps"></div>
  <div class="btn" id="startBtn">출발하기</div>
  <div class="keys" id="keysHint">
    화면 클릭 또는 <kbd>Space</kbd> 출발 / 일시정지 &nbsp;·&nbsp; <kbd>V</kbd> 맨 앞줄 / 둘째 칸 &nbsp;·&nbsp; <kbd>C</kbd> 외부 시점 &nbsp;·&nbsp; <kbd>M</kbd> 소리<br>
    마우스·터치 드래그 주위 둘러보기 &nbsp;·&nbsp; <kbd>R</kbd> 처음부터 &nbsp;·&nbsp; <kbd>1</kbd> / <kbd>2</kbd> 맵 바꾸기
  </div>
</div>
<div id="mapTag"></div>
<div id="touch" class="hidden">
  <button data-act="pause" class="primary"><span>▶</span>출발</button>
  <button data-act="seat"><span>🪑</span>둘째칸</button>
  <button data-act="chase"><span>🎥</span>외부</button>
  <button data-act="mute"><span>🔊</span>소리</button>
  <button data-act="map"><span>🗺</span>맵</button>
  <button data-act="reset"><span>↺</span>처음</button>
</div>
<div id="hud">
  <b id="speed">0</b> km/h<br>
  <small>높이 <span id="height">0</span> m &nbsp;·&nbsp; <span id="gforce">1.0</span> G &nbsp;·&nbsp; <span id="lap">1</span>바퀴</small>
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  if (typeof THREE === 'undefined') {
    document.getElementById('loading').textContent = '3D 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침해 주세요.';
    return;
  }
 
  const col = h => new THREE.Color(h).convertSRGBToLinear();
  const G = 9.81;
 
  // ---------- 기기 감지: 터치 기기면 화면 버튼, 폰/저사양이면 그래픽 자동 완화 ----------
  const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const IS_PHONE = IS_TOUCH && Math.min(screen.width, screen.height) < 820;
  const LOW_END = IS_PHONE || (navigator.hardwareConcurrency || 8) <= 4 || /iPad|iPhone|iPod|Android/i.test(navigator.userAgent);
  const Q = LOW_END
    ? { pixelRatio: 1.3, shadowMap: 2048, softShadow: false, trees: 700, anisotropy: 2 }
    : { pixelRatio: 1.75, shadowMap: 4096, softShadow: true, trees: 1400, anisotropy: 4 };
 
  // =====================================================================
  //  루프 생성기 (클로소이드): 곡률이 바닥→정상까지 선형 증가. 실제 루프처럼 진입/탈출이 바닥 위에서 X자 교차
  // =====================================================================
  function clothoidLoop(o) {
    const dir = o.dir || 1, kb = 1 / o.Rb, kt = 1 / o.Rt, L = 2 * Math.PI / (kb + kt), n = 2000, ds = L / n, every = 150;
    const pts = [], ring = []; let top = [0, -1], left = [1e9, 0], right = [-1e9, 0];
    let s = 0, x = 0, y = 0, th = 0;
    for (let i = 0; i <= 2 * n; i++) {
      if (i % every === 0 || i === 2 * n) {
        const f = i / (2 * n), px = o.x0 + dir * x, py = o.y0 + y;
        pts.push([px, py, o.z0 + (o.z1 - o.z0) * f]);
        ring.push([px + dir * Math.sin(th) * 1.5, py - Math.cos(th) * 1.5]);
        if (py > top[1]) top = [px, py];
        if (px < left[0]) left = [px, py];
        if (px > right[0]) right = [px, py];
      }
      const ss = s <= L ? s : 2 * L - s, k = kb + (kt - kb) * ss / L;
      x += Math.cos(th) * ds; y += Math.sin(th) * ds; th += k * ds; s += ds;
    }
    return { pts, ring, top, left, right, zc: (o.z0 + o.z1) / 2 };
  }
  // 코사인 파형 에어타임 힐 (정상·골 반지름 ≈ 32m)
  function cosHills(xFrom, xTo, z, dz, period, amp) {
    const out = []; const step = xFrom > xTo ? -11 : 11;
    for (let x = xFrom; step < 0 ? x >= xTo : x <= xTo; x += step) out.push([x, 4 + amp / 2 * (1 - Math.cos(2 * Math.PI * Math.abs(x - xFrom) / period)), z + Math.abs(x - xFrom) * dz]);
    return out;
  }
 
  // =====================================================================
  //  맵 정의
  // =====================================================================
  const STATION = [[-45, 4, 0], [-25, 4, 0], [0, 4, 0], [25, 4, 0], [45, 6, 0]];
  const FINAL_TURN = [[30, 10, 60], [10, 12, 60], [-15, 5, 58], [-45, 5, 56], [-72, 6, 52], [-88, 6, 34], [-88, 5, 18], [-75, 4, 6], [-58, 4, 1]];
 
  const MAPS = {
    texpress: {
      name: 'T-Express', tag: 'Wooden Hybrid', style: 'wood', liftSpeed: 8,
      desc: '나무 골조 하이브리드. 70m 리프트 → 77° 낙하 → 에어타임 힐 → 360° 루프 → 뱅크 턴 → 버니홉 연속',
      layout: { x0: -110, x1: 545, z0: -40, z1: 145 }, sunTarget: [215, 0, 60],
      loops: [{ x0: 360, y0: 4, z0: 15, z1: 22, Rb: 34, Rt: 16 }],
      rolls: [],
      build(loops) {
        return [
          ...STATION,
          [70, 20, 0], [100, 36, 0], [130, 52, 0], [152, 65, 0], [164, 70, 0],
          [172, 67, 0], [176, 59, 0.5], [179, 47, 1], [182, 35, 1.5],
          [186.4, 24, 2], [192.7, 15.7, 3], [201, 9.4, 4], [210.6, 5.4, 5], [221, 4, 6], [235, 4, 7],
          [250, 8, 8], [260, 16, 9], [268, 27, 10], [272, 34, 10.5], [290, 42, 11], [308, 34, 11.5], [312, 27, 12], [320, 16, 13], [330, 8, 14], [345, 4, 15], [356, 4, 15],
          ...loops[0].pts,
          [394, 4, 23], [404, 5, 24],
          [412, 9, 25], [420, 15, 26], [428, 20.5, 26.5], [436, 23, 27], [444, 23, 27.5], [452, 20.5, 28], [460, 15, 29], [468, 9, 30], [478, 4.5, 31], [490, 4, 32],
          [508, 8, 40], [526, 13, 57], [531, 16, 78], [522, 14, 98], [504, 10, 112], [482, 6, 117],
          ...cosHills(458, 260, 118, -0.03, 90, 13),
          [240, 5, 112], [205, 7, 105], [170, 8, 97], [135, 7, 86], [100, 6, 75], [60, 5, 66],
          ...FINAL_TURN,
        ];
      }
    },
    steel: {
      name: 'Sky Dragon', tag: 'Steel Coaster', style: 'steel', liftSpeed: 8,
      desc: '스틸 코스터. 75m 리프트 → 80° 낙하 → 45m 카멜백 → 47m 클로소이드 루프 → 제로-G 롤 → 오버뱅크 턴 → 에어타임 힐 → 연못 위 헬릭스',
      layout: { x0: -110, x1: 610, z0: -40, z1: 195 }, sunTarget: [250, 0, 80],
      loops: [{ x0: 384, y0: 4, z0: 8, z1: 15, Rb: 38, Rt: 18 }],
      rolls: [{ from: [464, 21, 19], to: [500, 21, 21], turns: 1 }],
      pond: { x: 290, z: 143, r: 24 },
      build(loops) {
        const helix = [];
        for (let k = 0; k <= 8; k++) { const a = k / 8 * Math.PI * 2; helix.push([290 - 35 * Math.sin(a), 6 + 12 * k / 8, 143 - 35 * Math.cos(a)]); }
        return [
          ...STATION,
          [70, 20, 0], [100, 37, 0], [130, 54, 0], [155, 68, 0], [170, 75, 0], [178, 75, 0],       // 리프트 75m
          [185, 72, 0], [189, 66, 0], [192, 53, 0], [194, 41.2, 0],                                 // 80° 낙하
          [199.3, 26.5, 0], [206.5, 17.2, 0], [215.8, 10, 0], [226.7, 5.5, 0], [238.3, 4, 0],       // 풀아웃 r=45
          [251.7, 6.4, 1], [263.7, 13.4, 1.5], [272.6, 24, 2],                                     // 카멜백 상승
          [279.8, 31, 2.8], [286, 38.4, 3], [294.4, 43.3, 3.3], [304, 45, 3.6], [313.6, 43.3, 4], [322, 38.4, 4.3], [328.2, 31, 4.6], // 정상 r=28 (에어타임)
          [332.2, 24, 5], [341.1, 13.4, 5.5], [353.1, 6.4, 6], [366.8, 4, 7], [378, 4, 8],          // 하강 + 골 r=40
          ...loops[0].pts,                                                                            // 360° 루프
          [418, 4, 16], [432, 5, 17],
          [447, 12, 18], [462, 21, 19], [482, 24, 20], [502, 21, 21], [517, 12, 22], [532, 5, 23], [547, 4, 24], // 제로-G 롤 힐
          [567, 8, 30], [584, 14, 46], [590, 18, 66], [582, 16, 86], [564, 10, 100], [542, 6, 106],  // 오버뱅크 턴어라운드
          ...cosHills(517, 337, 108, 0, 90, 13),                                                      // 에어타임 힐 ×2
          [325, 5, 108], ...helix,                                                                    // 상승 헬릭스 (연못 둘레, 6→18m)
          [255, 14, 108], [225, 7, 106], [200, 14, 104], [190, 16, 103], [180, 14, 102], [160, 4, 98],
          [140, 12, 90], [130, 14, 86], [120, 12, 82], [100, 5, 75], [80, 6, 70], [60, 5, 66],
          ...FINAL_TURN,
        ];
      }
    }
  };
  const params = new URLSearchParams(location.search);
  const mapId = MAPS[params.get('map')] ? params.get('map') : 'texpress';
  const MAP = MAPS[mapId];
  const LOOPS = MAP.loops.map(clothoidLoop);
  document.getElementById('mapTag').textContent = MAP.name.toUpperCase() + ' · ' + MAP.tag.toUpperCase();
  document.getElementById('ovSub').textContent = MAP.tag;
 
  // ---------- 기본 설정 ----------
  const LIFT_SPEED = MAP.liftSpeed;
  const MIN_SPEED = 3.0;
  const HEAD_HEIGHT = 1.5;
  const SEAT_OFFSET = 0.42;
  const RAIL_GAUGE = 1.2;
  const SAMPLES = 2800;
  const CAR_SPACING = 3.3;
  const CAR_COUNT = 6;
  const CAMERA_CAR = 1;
 
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.pixelRatio));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = Q.softShadow ? THREE.PCFSoftShadowMap : THREE.PCFShadowMap;
  document.body.appendChild(renderer.domElement);
 
  const scene = new THREE.Scene();
  const HORIZON = col(0xd6e6f3);
  scene.fog = new THREE.Fog(HORIZON, 300, 1400);
  const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 3000);
 
  // ---------- 하늘 ----------
  {
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: { top: { value: col(0x3d7fd6) }, mid: { value: col(0x8fbde8) }, bottom: { value: HORIZON } },
      vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
      fragmentShader: 'uniform vec3 top, mid, bottom; varying vec3 vW; void main(){ float h = normalize(vW).y; vec3 c = h < 0.0 ? bottom : (h < 0.25 ? mix(bottom, mid, smoothstep(0.0, 0.25, h)) : mix(mid, top, smoothstep(0.25, 1.0, h))); gl_FragColor = vec4(c, 1.0);\n#include <tonemapping_fragment>\n#include <encodings_fragment>\n}'
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(2400, 32, 16), skyMat));
  }
 
  // ---------- 조명 ----------
  scene.add(new THREE.HemisphereLight(0xcfe3f5, 0x6b7a4a, 0.75));
  const sun = new THREE.DirectionalLight(0xfff1dc, 1.35);
  sun.position.set(-260, 420, -180);
  sun.castShadow = true;
  sun.shadow.mapSize.set(Q.shadowMap, Q.shadowMap);
  sun.shadow.camera.near = 50; sun.shadow.camera.far = 1300;
  const SH = (MAP.layout.x1 - MAP.layout.x0) * 0.62;
  sun.shadow.camera.left = -SH; sun.shadow.camera.right = SH; sun.shadow.camera.top = SH; sun.shadow.camera.bottom = -SH;
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.4;
  sun.target.position.set(...MAP.sunTarget);
  scene.add(sun, sun.target);
 
  // ---------- 절차적 텍스처 ----------
  function woodTexture(base, dark, w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 140; i++) {
      g.strokeStyle = dark; g.globalAlpha = 0.05 + rnd() * 0.16; g.lineWidth = 0.5 + rnd() * 2.2;
      const x = rnd() * w; g.beginPath(); g.moveTo(x, 0);
      for (let y = 0; y <= h; y += 16) g.lineTo(x + Math.sin(y * 0.03 + i) * 3 + (rnd() - 0.5) * 2, y);
      g.stroke();
    }
    g.globalAlpha = 1;
    const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = Q.anisotropy; return t;
  }
  const woodTex = woodTexture('#b58a55', '#5a3a1c', 256, 512);
  const woodTexDark = woodTexture('#8f6a3f', '#3e2812', 256, 512);
 
  // =====================================================================
  //  트랙 곡선 + 샘플링
  // =====================================================================
  const controlPoints = MAP.build(LOOPS).map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(controlPoints, true, 'centripetal');
  curve.arcLengthDivisions = 8000;
  const TRACK_LENGTH = curve.getLength();
  const DS = TRACK_LENGTH / SAMPLES;
 
  const P = [], T = [], UP = [], KAPPA = [];
  for (let i = 0; i < SAMPLES; i++) { const u = i / SAMPLES; P.push(curve.getPointAt(u)); T.push(curve.getTangentAt(u).normalize()); }
  let MAX_Y = 0; P.forEach(p => { if (p.y > MAX_Y) MAX_Y = p.y; });
  const rawK = [];
  for (let i = 0; i < SAMPLES; i++) {
    const a = T[(i - 1 + SAMPLES) % SAMPLES], b = T[(i + 1) % SAMPLES];
    rawK.push(new THREE.Vector3().subVectors(b, a).multiplyScalar(1 / (2 * DS)));
  }
  const SMOOTH = 8;
  for (let i = 0; i < SAMPLES; i++) {
    const k = new THREE.Vector3();
    for (let j = -SMOOTH; j <= SMOOTH; j++) k.add(rawK[(i + j + SAMPLES) % SAMPLES]);
    KAPPA.push(k.multiplyScalar(1 / (2 * SMOOTH + 1)));
  }
  let liftEndIndex = 0;
  for (let i = 1; i < SAMPLES * 0.3; i++) if (P[i].y > P[liftEndIndex].y) liftEndIndex = i;
  const LIFT_END_S = liftEndIndex * DS;
 
  const _tan = new THREE.Vector3();
  function tangentAt(s) {

  // ---------- HUD ----------
  let hudTimer = 0;
  function updateHUD(dt) {
    hudTimer += dt; if (hudTimer < 0.1) return; hudTimer = 0;
    const f = getFrame(state.s - CAMERA_CAR * CAR_SPACING);
    const accel = new THREE.Vector3(0, G, 0).addScaledVector(f.kappa, state.v * state.v);
    elSpeed.textContent = Math.round(state.v * 3.6);
    elHeight.textContent = Math.round(f.pos.y);
    elG.textContent = (accel.dot(f.up) / G).toFixed(1);
    elLap.textContent = state.lap;
  }
 
  // ---------- 메인 루프 ----------
  let last = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (state.running) for (let i = 0; i < 4; i++) physics(dt / 4);
    updateCamera(dt);
    updateHUD(dt);
    audio.update(dt, state.v, state.s < LIFT_END_S + 2 && state.s > 30, state.running);
    renderer.render(scene, camera);
  }
 
  document.getElementById('loading').classList.add('hidden');
  overlay.classList.remove('hidden');
  onResize();
  updateCamera(0);
  requestAnimationFrame(animate);
 
  // 디버그용
  window.coaster = {
    state, mapId, trackLength: TRACK_LENGTH, liftEnd: LIFT_END_S, maxY: MAX_Y, maxV: MAX_V, lapTime: LAP_TIME,
    jumpTo(s, v) { state.s = s; if (v != null) state.v = v; first = true; updateCamera(0); },
    topView(on) { state.freeCam = !!on; if (on) { const cx = (LAYOUT.x0 + LAYOUT.x1) / 2, cz = (LAYOUT.z0 + LAYOUT.z1) / 2; camera.position.set(cx, 560, cz); camera.up.set(0, 0, -1); camera.lookAt(cx, 0, cz); camera.up.set(0, 1, 0); } else first = true; },
    step(dt) { physics(dt); },
    frameAt(s) { const f = getFrame(s, newFrame()); return { x: f.pos.x, y: f.pos.y, z: f.pos.z, upY: f.up.y, kappa: f.kappa.length() }; },
    gAt(s, v) { const f = getFrame(s, newFrame()); return new THREE.Vector3(0, G, 0).addScaledVector(f.kappa, v * v).dot(f.up) / G; },
    freeLook(px, py, pz, tx, ty, tz) { state.freeCam = true; camera.position.set(px, py, pz); camera.up.set(0, 1, 0); camera.lookAt(tx, ty, tz); renderer.render(scene, camera); },
    render() { updateCamera(0); renderer.render(scene, camera); }
  };
})();
</script>
